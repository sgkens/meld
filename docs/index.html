<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meld.js Documentation</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: #F9F9FB; margin: 0; display: flex; height: 100vh; overflow: hidden; }
    nav { width: 250px; background: #fff; border-right: 1px solid #eaeaea; padding: 20px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    nav a { text-decoration: none; color: #2C3E50; padding: 8px 12px; border-radius: 6px; font-weight: 500; transition: background 0.2s; }
    nav a:hover, nav a.active { background: #f4f4f5; color: #D64045; }
    main { flex: 1; padding: 40px; overflow-y: auto; line-height: 1.6; }
    .markdown-body { max-width: 800px; margin: 0 auto; }
    pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; }
    code { font-family: monospace; background: #f6f8fa; padding: 2px 4px; border-radius: 3px; }
    pre code { padding: 0; background: transparent; }
    h1, h2, h3 { color: #1a1a1a; margin-top: 2em; }
    h1 { border-bottom: 1px solid #eaeaea; padding-bottom: 10px; margin-top: 0; }
    a { color: #D64045; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 1em; }
    th, td { border: 1px solid #eaeaea; padding: 8px; text-align: left; }
    th { background: #f9f9fb; }
    blockquote { border-left: 4px solid #D64045; margin: 0; padding-left: 1em; color: #666; }
  </style>
</head>
<body>
  <meld-app></meld-app>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module">
    import { defineMeld, meldHtml, meldState, use, inject, onMount, meld } from '../src/meld.core.js';
    import { MeldRouter } from '../src/plugins/meld-router.js';

    // A component to fetch and render markdown
    defineMeld('doc-page', (el) => {
      const state = meldState({ content: 'Loading...', loading: true });
      
      onMount(async () => {
        try {
          const file = el.getAttribute('file');
          const res = await fetch(file);
          if (!res.ok) throw new Error('Not found');
          const text = await res.text();
          state.content = marked.parse(text);
        } catch (e) {
          state.content = '<h1>404 - Page Not Found</h1>';
        } finally {
          state.loading = false;
        }
      });

      return meldHtml`
        <div class="markdown-body">
          \${() => state.loading ? 'Loading...' : meld.raw(state.content)}
        </div>
      `;
    });

    use(MeldRouter, {
      routes: [
        { path: '/', component: 'doc-home' },
        { path: '/installation', component: 'doc-install' },
        { path: '/core-api', component: 'doc-core' },
        { path: '/plugins', component: 'doc-plugins' },
        { path: '/cli', component: 'doc-cli' },
        { path: '/caveats', component: 'doc-caveats' },
        { path: '/advanced', component: 'doc-advanced' },
        { path: '/bootcamp', component: 'doc-bootcamp' }
      ]
    });

    defineMeld('doc-home', () => meldHtml\`<doc-page file="./index.md"></doc-page>\`);
    defineMeld('doc-install', () => meldHtml\`<doc-page file="./installation.md"></doc-page>\`);
    defineMeld('doc-core', () => meldHtml\`<doc-page file="./core-api.md"></doc-page>\`);
    defineMeld('doc-plugins', () => meldHtml\`<doc-page file="./plugins.md"></doc-page>\`);
    defineMeld('doc-cli', () => meldHtml\`<doc-page file="./cli.md"></doc-page>\`);
    defineMeld('doc-caveats', () => meldHtml\`<doc-page file="./caveats.md"></doc-page>\`);
    defineMeld('doc-advanced', () => meldHtml\`<doc-page file="./advanced-architecture.md"></doc-page>\`);
    defineMeld('doc-bootcamp', () => meldHtml\`<doc-page file="./bootcamp.md"></doc-page>\`);

    defineMeld('meld-app', (el, { inject }) => {
      const router = inject('router');
      const linkClass = (path) => router && router.currentPath === path ? 'active' : '';

      return meldHtml`
        <nav>
          <div style="font-weight: bold; font-size: 1.2rem; padding: 10px; color: #D64045;">🔗 Meld.js Docs</div>
          <a href="#/" class="\${() => linkClass('/')}">Introduction</a>
          <a href="#/installation" class="\${() => linkClass('/installation')}">Installation</a>
          <a href="#/core-api" class="\${() => linkClass('/core-api')}">Core API</a>
          <a href="#/plugins" class="\${() => linkClass('/plugins')}">Plugins</a>
          <a href="#/cli" class="\${() => linkClass('/cli')}">Artisan CLI</a>
          <a href="#/caveats" class="\${() => linkClass('/caveats')}">Known Limitations</a>
          <a href="#/advanced" class="\${() => linkClass('/advanced')}">KMEL Architecture</a>
          <a href="#/bootcamp" class="\${() => linkClass('/bootcamp')}">30-Min Bootcamp</a>
        </nav>
        <main>
          <meld-view></meld-view>
        </main>
      `;
    });
  </script>
</body>
</html>
