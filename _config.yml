# ----------------------------------------------------------------------
# GLOBAL SETUP
# ----------------------------------------------------------------------
remote_theme: just-the-docs/just-the-docs

# Site Metadata
title: MELD.JS
description: The 2kb Micro-Frontend Engine. Reactive State. Native Components. No Build Step.
author: sgkens
favicon_ico: "/logo.svg"

# ----------------------------------------------------------------------
# AESTHETICS & NAVIGATION
# ----------------------------------------------------------------------
color_scheme: custom
search_enabled: true
footer_content: "Copyright &copy; 2026 MELD.JS Contributors. Released under the MIT License."

# Navigation Settings
aux_links:
  "GitLab Repo": "https://gitlab.com/sgkens/meldjs"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

# Collections
collections:
  docs:
    output: true
    permalink: /docs/:path/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
