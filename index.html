<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meld.js v1.4 Ultimate Demo</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: var(--mui-bg); color: var(--mui-fg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
    nav { width: 240px; background: #1a1a1a; color: white; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    nav a { color: #888; text-decoration: none; padding: 10px; border-radius: 6px; transition: 0.2s; }
    nav a:hover, nav a.active { background: #333; color: white; }
    main { flex: 1; padding: 40px; overflow-y: auto; background: var(--mui-surface); }
    .demo-card { background: var(--mui-bg); padding: 24px; border-radius: 12px; box-shadow: var(--mui-shadow-sm); margin-bottom: 20px; }
    
    /* View Transitions */
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.3s; }
  </style>
</head>
<body>

  <meld-app></meld-app>
  <m-toast-provider></m-toast-provider>

  <script type="module">
    import { defineMeld, meldHtml, meldState, use, meld, inject } from './src/meld.core.js';
    import { initMeldUI } from './src/theme.js';
    
    // Plugins
    import { MeldRouter } from './src/plugins/meld-router.js';
    import { MeldStore } from './src/plugins/meld-store.js';
    import { MeldPersist } from './src/plugins/meld-persist.js';
    import { MeldQuery } from './src/plugins/meld-query.js';
    import { MeldPortal } from './src/plugins/meld-portal.js';
    import { MeldA11y } from './src/plugins/meld-a11y.js';
    import { MeldAI } from './src/plugins/meld-ai.js';
    import { MeldSkeleton } from './src/plugins/meld-skeleton.js';
    import { MeldTime } from './src/plugins/meld-time.js';

    // UI Components
    import './src/components/layout/m-stack.js';
    import './src/components/layout/m-card.js';
    import './src/components/layout/m-divider.js';
    import './src/components/input/m-button.js';
    import './src/components/input/m-input.js';
    import './src/components/input/m-switch.js';
    import './src/components/data/m-badge.js';
    import './src/components/data/m-avatar.js';
    import './src/components/navigation/m-tabs.js';
    import './src/components/layout/m-modal.js';
    import { toast } from './src/components/data/m-toast.js';

    // Initialize UI
    initMeldUI();

    // Use Plugins
    use(MeldStore);
    use(MeldPersist);
    use(MeldQuery);
    use(MeldPortal);
    use(MeldA11y);
    use(MeldAI);
    use(MeldSkeleton);
    use(MeldTime);

    // Global Store
    const globalStore = meldState({ theme: 'light', user: { name: 'Dev' } });

    // --- PAGES ---

    defineMeld('page-home', () => {
      return meldHtml`
        <m-stack vertical align="start" gap="4">
          <h1>Welcome to Meld v1.4</h1>
          <p>The anti-complexity framework for modern engineering.</p>
          
          <m-card style="width: 400px;">
            <div slot="header">Featured Component</div>
            <m-stack gap="3">
              <m-avatar name="Meld Logo" src="./logo.svg"></m-avatar>
              <div>
                <strong>Meld Core</strong>
                <div style="font-size: 0.8rem; color: #666;">v1.4.0 • 2kb</div>
              </div>
            </m-stack>
            <m-divider></m-divider>
            <m-button onclick="${() => toast.success('Meld RC-1 is ready!')}">Get Started</m-button>
          </m-card>
        </m-stack>
      `;
    });

    defineMeld('page-ui', () => {
      const state = meldState({ loading: false });
      return meldHtml`
        <h1>Meld UI v1.0 MVP</h1>
        <section class="demo-card">
          <h3>Buttons & Inputs</h3>
          <m-stack gap="2">
            <m-button onclick="${() => { state.loading = true; setTimeout(()=>state.loading=false, 2000); }}" ?loading="${() => state.loading}">Primary</m-button>
            <m-button variant="outline">Outline</m-button>
            <m-badge variant="success">Active</m-badge>
          </m-stack>
          <br/>
          <m-input label="Username" placeholder="Enter name..."></m-input>
          <br/>
          <m-stack gap="2">
            <span>Notifications:</span>
            <m-switch></m-switch>
          </m-stack>
        </section>

        <section class="demo-card">
          <h3>Navigation</h3>
          <m-tabs>
            <span slot="tab">Overview</span>
            <span slot="tab">Settings</span>
            <span slot="tab">Security</span>
            <div style="padding: 20px 0;">Tab Content rendered here.</div>
          </m-tabs>
        </section>
      `;
    });

    defineMeld('page-ai', (el, { useAI }) => {
      const { prompt, completion, isLoading } = useAI('https://api.example.com/stream');
      return meldHtml`
        <h1>Meld AI Plugin</h1>
        <div class="demo-card">
          <m-input ref="${(n)=>el.input=n}" placeholder="Ask AI anything..."></m-input>
          <br/>
          <m-button onclick="${() => prompt(el.input.value)}" ?loading="${() => isLoading}">Generate</m-button>
          <m-divider></m-divider>
          <div style="min-height: 100px; white-space: pre-wrap;">
            ${() => isLoading && !completion ? meldHtml`<meld-skeleton height="60px"></meld-skeleton>` : completion}
          </div>
        </div>
      `;
    });

    // --- APP SHELL ---

    use(MeldRouter, {
      routes: [
        { path: '/', component: 'page-home' },
        { path: '/ui', component: 'page-ui' },
        { path: '/ai', component: 'page-ai' }
      ]
    });

    defineMeld('meld-app', (el, { inject }) => {
      const router = inject('router');
      return meldHtml`
        <style>
          :host { display: flex; width: 100%; height: 100%; }
        </style>
        <nav>
          <m-stack gap="2" style="margin-bottom: 20px;">
            <img src="./logo.svg" width="32" />
            <h2 style="margin:0; font-size: 1.2rem;">Meld Artisan</h2>
          </m-stack>
          <a href="#/" class="${() => router.currentPath === '/' ? 'active' : ''}">Dashboard</a>
          <a href="#/ui" class="${() => router.currentPath === '/ui' ? 'active' : ''}">UI Library</a>
          <a href="#/ai" class="${() => router.currentPath === '/ai' ? 'active' : ''}">AI Streaming</a>
          <div style="margin-top: auto; padding: 10px; font-size: 0.8rem; color: #555;">
            <meld-time date="${new Date().toISOString()}" format="relative"></meld-time>
          </div>
        </nav>
        <main>
          <meld-view></meld-view>
        </main>
      `;
    });
  </script>
</body>
</html>
