<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meld.js Task Manager Demo</title>
  <link rel="icon" type="image/svg+xml" href="../logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --mui-bg: #fbfcfe;
      --mui-fg: #111827;
      --mui-surface: #ffffff;
      --mui-border: #d8e1ea;
      --mui-primary: #0f766e; /* accent (teal) */
      --mui-primary-hover: #0d6059;
      --mui-primary-fg: #ffffff;
      --mui-accent-red: #b42318;
      --mui-accent-amber: #b7791f;
      --mui-shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --mui-shadow-md: 0 10px 15px -3px rgba(17, 24, 39, 0.1), 0 4px 6px -2px rgba(17, 24, 39, 0.05);
    }
    [data-theme='dark'] {
      --mui-bg: #0b1020;
      --mui-fg: #f8fafc;
      --mui-surface: #121a2a;
      --mui-border: #2f3a52;
      --mui-primary: #5eead4; /* accent (teal) */
      --mui-primary-hover: #2dd4bf;
      --mui-primary-fg: #0f172a;
      --mui-accent-red: #fca5a5;
      --mui-accent-amber: #fcd34d;
      --mui-shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
      --mui-shadow-md: 0 18px 50px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--mui-bg);
      color: var(--mui-fg);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 8% 10%, color-mix(in srgb, var(--mui-primary) 12%, transparent), transparent 30rem),
        radial-gradient(circle at 92% 18%, color-mix(in srgb, var(--mui-accent-amber) 10%, transparent), transparent 30rem);
      opacity: 0.8;
      z-index: -1;
    }

    /* Support smooth page transitions using View Transitions API */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.25s;
    }
  </style>
</head>
<body>

  <!-- Main Application Root -->
  <app-root></app-root>

  <script type="module">
    import { initMeldUI } from '../src/theme.js';
    import './src/components/app-root.js';

    // Initialize Meld Design Tokens
    initMeldUI();
  </script>
</body>
</html>
